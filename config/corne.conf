# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y
# zmk studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# Deep-sleep after 30 min idle to save battery (any key wakes it)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# ---------------------------------------------------------------------------
# nice!oled custom screen (module: mctechnology17/zmk-nice-oled)
# ---------------------------------------------------------------------------
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# Left-half widgets (Bongo Cat, modifiers) live in corne_left.conf,
# right-half animation in corne_right.conf.
